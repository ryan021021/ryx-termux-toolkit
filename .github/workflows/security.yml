name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes de segurança (backups hostis, varredura estática, injeção)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests/security -t . -v
      - name: Regras S do ruff (bandit)
        run: |
          python -m pip install ruff
          python -m ruff check --select S src
