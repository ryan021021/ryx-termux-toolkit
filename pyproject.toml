[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ryx-termux-toolkit"
version = "0.1.0"
description = "Toolkit modular para Termux: diagnóstico, shell, pacotes, servidor, automação e IA, com dry-run por padrão."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["termux", "android", "cli", "toolkit"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8", "pip-audit>=2.7", "bandit>=1.7"]

[project.scripts]
ryx = "ryx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S604", "S607"]
"src/ryx/modules/*.py" = ["S603"]
